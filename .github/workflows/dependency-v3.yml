name: Patch v3 dependency lock
on:
  push:
    branches: [work/detoks-eu-storefront]
    paths: [.github/workflows/dependency-v3.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/detoks-eu-storefront
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp package-lock.json /tmp/before-lock.json
      - run: npm update brace-expansion --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Reject unrelated dependency changes
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const before=JSON.parse(readFileSync('/tmp/before-lock.json'));
          const after=JSON.parse(readFileSync('package-lock.json'));
          assert.deepEqual(Object.keys(after.packages),Object.keys(before.packages));
          for(const [path,entry] of Object.entries(after.packages)){
            if(JSON.stringify(entry)===JSON.stringify(before.packages[path])) continue;
            assert.ok(path.endsWith('/brace-expansion'), `Unexpected package change ${path}`);
            assert.ok(['1.1.21','5.0.12'].includes(entry.version), `Unexpected version ${entry.version}`);
            console.log(`${path}: ${before.packages[path].version} -> ${entry.version}`);
          }
          JS
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Preserve tested lockfile on working branch only
        run: |
          git config user.name 'Detoks project automation'
          git config user.email 'detoks-automation@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: patch brace-expansion 1.1.21 and 5.0.12 without unrelated upgrades'
          git push origin HEAD:work/detoks-eu-storefront
          mkdir -p /tmp/v3-lock
          cp package-lock.json /tmp/v3-lock/
          npm audit --json > /tmp/v3-lock/audit.json
          git rev-parse HEAD > /tmp/v3-lock/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-patched-lock
          path: /tmp/v3-lock
          retention-days: 1
