name: Source review snapshot
on:
  push:
    branches: [work/detoks-eu-storefront]
    paths: [.github/workflows/source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz --output=/tmp/detoks-current-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: detoks-current-source
          path: /tmp/detoks-current-source.tar.gz
          retention-days: 1
