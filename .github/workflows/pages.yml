name: Pages (statik önizleme)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test && npm run typecheck && npm run lint
      - run: npm run build:pages
      - name: Record public deployment identity
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync,readFileSync} from 'node:fs';
          writeFileSync('dist/client/build.json',JSON.stringify({version:JSON.parse(readFileSync('src/data/release.json','utf8')).version,commit:process.env.BUILD_COMMIT,builtAt:new Date().toISOString(),mode:'catalogue-preview',paymentActivated:false},null,2));
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prove the public site serves this version and customer journeys
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/v3-live-smoke.mjs && node scripts/three-rounds-browser.mjs && node scripts/refinement-browser.mjs && node scripts/design-v4-browser.mjs && node scripts/aktar-hero-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detoks-aktar-live-proof
          path: qa-live
          retention-days: 14
