name: Licensed typography reference
on:
  push:
    branches: [work/design-v4]
    paths: [.github/workflows/design-type-reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve exact reviewed open-source typeface blobs
        run: |
          mkdir -p /tmp/type-reference
          python - <<'PY'
          import urllib.request,hashlib,pathlib
          files=[('Literata%5Bopsz%2Cwght%5D.ttf','Literata.ttf','0a81b4984a4a4eb101e0ddc28babc85bb137efef'),('OFL.txt','OFL-Literata.txt','9d3b4e3b1e9068fbda799f57833ff831d05cc271')]
          for remote,name,sha in files:
              body=urllib.request.urlopen('https://raw.githubusercontent.com/google/fonts/main/ofl/literata/'+remote,timeout=30).read()
              assert hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==sha
              pathlib.Path('/tmp/type-reference',name).write_bytes(body)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: detoks-type-reference
          path: /tmp/type-reference
          retention-days: 1
