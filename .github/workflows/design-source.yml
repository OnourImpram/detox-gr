name: Design source workspace
on:
  push:
    branches: [work/design-v4]
    paths: [.github/workflows/design-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 497e67aa9af2a69cf162e42d305bfbb20dee256c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Snapshot exact source and installed dependencies for offline verification
        run: |
          git archive --format=tar.gz -o /tmp/source.tar.gz HEAD
          tar -czf /tmp/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: detoks-design-workspace
          path: |
            /tmp/source.tar.gz
            /tmp/dependencies.tar.gz
          retention-days: 1
