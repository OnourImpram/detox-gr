name: Integrate Detoks v3
on:
  push:
    branches: [work/detoks-eu-storefront]
    paths: [.github/workflows/import-v3.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/detoks-eu-storefront
          fetch-depth: 2
      - name: Reject concurrent base changes
        run: test "$(git rev-parse HEAD^)" = 8eb9e2f8489eb5031508f58f74a0394250b5f4ca
      - name: Import only the reviewed source and media changes
        env:
          V3_PACKAGE: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-5c08-820a-adb8-dfa6f1ec1ed3/raw?se=2026-10-04T19%3A08%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=aaf76cda-5baa-5fd0-bf80-2cb28b2d1b32&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T06%3A36%3A49Z&ske=2026-10-05T06%3A36%3A49Z&sks=b&skv=2026-02-06&sig=oE/SjzKYQvM/Y%2B9fj4Qtl7%2B3j1k416tT0pBsOpsirr8%3D'
        run: |
          curl --fail --silent --show-error --location --max-time 60 "$V3_PACKAGE" -o /tmp/v3.zip
          echo '95f7d7cf6b4d5d21abface3d1071ccaa992d7b6ef4c5d9a28bcbde4a70d41faf  /tmp/v3.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile, pathlib, json, hashlib
          root = pathlib.Path.cwd()
          with zipfile.ZipFile('/tmp/v3.zip') as archive:
              manifest = json.loads(archive.read('V3-INTEGRATION.json'))
              assert manifest['baseline'] == '8eb9e2f8489eb5031508f58f74a0394250b5f4ca'
              assert len(manifest['files']) == 84 and len(manifest['delete']) == 251
              assert sum(item.file_size for item in archive.infolist()) < 10000000
              for name in [*manifest['files'], *manifest['delete']]:
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert name.startswith(('src/', 'public/', 'scripts/', 'docs/')) or name in ('.github/workflows/storefront-quality.yml', '.env.example', '.gitignore', 'README.md', 'package.json', 'package-lock.json')
                  assert path.suffix not in ('.ttf', '.otf', '.woff', '.woff2')
              for name, sha in manifest['delete'].items():
                  target = root / name
                  assert hashlib.sha256(target.read_bytes()).hexdigest() == sha, name
              for name, sha in manifest['files'].items():
                  data = archive.read(name)
                  assert hashlib.sha256(data).hexdigest() == sha, name
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              for name in manifest['delete']:
                  (root / name).unlink()
          PY
      - name: Commit the integration on the working branch only
        run: |
          git config user.name 'Detoks project automation'
          git config user.email 'detoks-automation@users.noreply.github.com'
          rm .github/workflows/import-v3.yml
          git add -A
          git commit -m 'feat: Detoks v3 with integrated product media, retired synthetic library and responsive storefront'
          git push origin HEAD:work/detoks-eu-storefront
          git rev-parse HEAD
