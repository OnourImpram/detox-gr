name: Approved aktar hero integration
on:
  push:
    branches: [work/aktar-hero-20261010]
    paths: [.github/workflows/import-aktar-hero.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/aktar-hero-20261010
          fetch-depth: 2
      - name: Require reviewed branch state
        run: test "$(git rev-parse HEAD^)" = b65beca5af58175102f0c4c02e7e61b5e7b90f41
      - name: Retrieve checksum-pinned approved assets and implementation
        env:
          PACKAGE_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-dbc4-820a-b1db-799349bfa892/raw?se=2026-10-10T13%3A53%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=9d283640-663a-52fa-bdfe-91d314f840b7&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T05%3A25%3A30Z&ske=2026-10-11T05%3A25%3A30Z&sks=b&skv=2026-02-06&sig=bzV0JuU88GEC6KZjNpkhyQhp66M2WkbzypKVkcQdhGo%3D'
        run: |
          curl --fail --silent --show-error --location --max-time 60 "$PACKAGE_URL" -o /tmp/aktar.zip
          echo '912d4c976a882c705d802fca2eb96d19707201f492d1c66ab1c6520ce878a6cb  /tmp/aktar.zip' | sha256sum -c -
          python - <<'PY'
          import pathlib,hashlib,json,zipfile
          root=pathlib.Path.cwd()
          with zipfile.ZipFile('/tmp/aktar.zip') as z:
              m=json.loads(z.read('PACKAGE.json'))
              assert m['base']=='2afedc9777a3f4fb6c6cae5941867618aafe82b0'
              assert len(m['files'])==43
              assert sum(f.file_size for f in z.infolist())<5000000
              for name,digest in m['existing'].items():
                  p=root/name
                  assert (not p.exists()) if digest is None else hashlib.sha256(p.read_bytes()).hexdigest()==digest, name
              for name,digest in m['files'].items():
                  path=pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert name.startswith(('src/','scripts/','docs/media/','public/media/hero/','public/yavas-dukkan/')) or name in ('package.json','package-lock.json','public/version.json','.github/workflows/pages.yml','.github/workflows/storefront-quality.yml')
                  assert path.suffix in ('.ts','.tsx','.json','.mjs','.md','.css','.html','.webp','.yml')
                  body=z.read(name)
                  assert hashlib.sha256(body).hexdigest()==digest
                  dest=root/path
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(body)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p qa-evidence
      - run: npm test > qa-evidence/tests.log 2>&1
      - run: npm run typecheck > qa-evidence/types.log 2>&1
      - run: npm run lint > qa-evidence/lint.log 2>&1
      - run: npm run build:pages > qa-evidence/pages.log 2>&1
      - run: npx playwright install --with-deps chromium
      - name: Verify both actual HTTP surfaces and image identity
        run: node scripts/aktar-hero-browser.mjs > qa-evidence/aktar-hero-browser.log 2>&1
      - name: Verify current multilingual design regression suite
        run: node scripts/design-v4-browser.mjs > qa-evidence/design-v4-browser.log 2>&1
      - name: Save tested implementation on isolated branch
        run: |
          git config user.name 'Detoks project automation'
          git config user.email 'detoks-automation@users.noreply.github.com'
          git rm .github/workflows/aktar-hero-source.yml .github/workflows/import-aktar-hero.yml
          git add .github/workflows/pages.yml .github/workflows/storefront-quality.yml src scripts docs/media public/media/hero public/yavas-dukkan public/version.json package.json package-lock.json
          git commit -m 'feat: install approved vinegar hero and publish the chosen Yavas Dukkan preview'
          git push origin HEAD:work/aktar-hero-20261010
          git rev-parse HEAD > qa-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aktar-hero-integration-evidence
          path: qa-evidence
          retention-days: 7
