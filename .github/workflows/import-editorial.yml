name: Import reviewed editorial package
on:
  push:
    branches: [work/detoks-eu-storefront]
    paths: [.github/workflows/import-editorial.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: work/detoks-eu-storefront
      - name: Require the reviewed base
        run: test "$(git rev-parse HEAD^)" = 937b4c15865b1a402cd10fdf109f1572869a750a
      - name: Retrieve only the reviewed website package
        env:
          PACKAGE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-40f4-8210-af08-6422549921fb/raw?se=2026-10-04T14%3A56%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=f0635018-5603-59d6-bccb-5aa71f20b8f7&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T04%3A11%3A36Z&ske=2026-10-05T04%3A11%3A36Z&sks=b&skv=2026-02-06&sig=7izgwgnq0G9h9E2saa8eRxvHq7oAabQMy3V%2BduX6%2BaM%3D'
        run: |
          curl --fail --silent --show-error --location --max-time 90 "$PACKAGE_URL" -o /tmp/editorial.zip
          echo '6215380cb1d9e22e6b93b73cf81451791a1d8ce216f23ca9e30c7956a3511f05  /tmp/editorial.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile, json, hashlib, pathlib
          root = pathlib.Path.cwd()
          with zipfile.ZipFile('/tmp/editorial.zip') as archive:
              checks = json.loads(archive.read('PATCH-SHA256.json'))
              assert len(checks) == 487
              assert sum(item.file_size for item in archive.infolist()) < 40000000
              for name, digest in checks.items():
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert name.startswith(('src/', 'scripts/', 'docs/', 'public/photos/taha-2026/'))
                  assert not name.endswith(('.woff', '.woff2', '.ttf', '.env'))
                  body = archive.read(name)
                  assert hashlib.sha256(body).hexdigest() == digest
                  target = root / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(body)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p qa-evidence
      - run: npm test > qa-evidence/tests.log 2>&1
      - run: npm run typecheck > qa-evidence/types.log 2>&1
      - run: npm run lint > qa-evidence/lint.log 2>&1
      - name: Save verified source changes on the work branch only
        run: |
          git config user.name 'Detoks project automation'
          git config user.email 'detoks-automation@users.noreply.github.com'
          git add src scripts docs public/photos/taha-2026
          git commit -m 'feat: rebuild complete brand narrative and integrate 151 provenance-tracked studio photographs'
          git push origin HEAD:work/detoks-eu-storefront
      - run: npm run build:pages > qa-evidence/pages.log 2>&1
      - run: npx playwright install --with-deps chromium
      - name: Browser verification
        continue-on-error: true
        run: node scripts/storefront-browser.mjs > qa-evidence/browser.log 2>&1
      - name: Server build
        continue-on-error: true
        run: npm run build > qa-evidence/production.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-integration-evidence
          path: qa-evidence
          retention-days: 7
