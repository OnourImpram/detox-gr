name: Preserve reviewed lockfile formatting
on:
  push:
    branches: [work/design-v4]
    paths: [.github/workflows/design-lock-normalize.yml]
permissions:
  contents: write
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/design-v4
          fetch-depth: 2
      - run: test "$(git rev-parse HEAD^)" = 68d326f48eebc6db25267297252ae3a65180ac54
      - name: Restore original CRLF without changing dependency metadata
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          path=pathlib.Path('package-lock.json')
          old=path.read_bytes()
          assert hashlib.sha256(old).hexdigest()=='217355aaa6080717f77c984e74291e4ebeb55810542654eddeb5eb302e86ae3a'
          new=old.replace(b'\r\n',b'\n').replace(b'\n',b'\r\n')
          assert json.loads(old)==json.loads(new)
          assert hashlib.sha256(new).hexdigest()=='d9af722608528dd7b7125e0203c3d258202d14d0a5161bc6e6a10b71b792ac17'
          path.write_bytes(new)
          PY
      - name: Save the formatting-only correction
        run: |
          git config user.name 'Detoks project automation'
          git config user.email 'detoks-automation@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: preserve original lockfile formatting without changing dependencies'
          git push origin HEAD:work/design-v4
