name: Storefront quality
on:
  push:
    branches: [work/detoks-eu-storefront, work/media-three-rounds]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: storefront-quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p qa-evidence
      - name: Dependency vulnerability audit
        id: dependencies
        continue-on-error: true
        run: npm audit --audit-level=high --json > qa-evidence/dependencies.json
      - name: Unit and integration tests
        id: tests
        continue-on-error: true
        run: npm test > qa-evidence/tests.log 2>&1
      - name: Type check
        id: types
        continue-on-error: true
        run: npm run typecheck > qa-evidence/types.log 2>&1
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > qa-evidence/lint.log 2>&1
      - name: Catalogue and v3 media audits
        id: catalogue
        continue-on-error: true
        run: node scripts/catalogue-audit.mjs > qa-evidence/catalogue.json && node scripts/audit-v3.mjs > qa-evidence/v3-audit.json
      - name: Pages preview build
        id: pages
        continue-on-error: true
        run: npm run build:pages > qa-evidence/pages.log 2>&1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Existing storefront scenarios
        id: browser
        continue-on-error: true
        run: node scripts/storefront-browser.mjs > qa-evidence/browser.log 2>&1
      - name: Twenty-language editorial scenarios
        id: editorial
        continue-on-error: true
        run: node scripts/editorial-browser.mjs > qa-evidence/editorial-browser.log 2>&1
      - name: v3 product media and interaction scenarios
        id: v3
        continue-on-error: true
        run: node scripts/v3-browser.mjs > qa-evidence/v3-browser.log 2>&1
      - name: Thirty generated compositions and all responsive assets
        id: scenes
        continue-on-error: true
        run: node scripts/three-rounds-browser.mjs > qa-evidence/scenes-browser.log 2>&1
      - name: Cold locale transitions under delayed networks
        id: locale
        continue-on-error: true
        run: node scripts/v3-locale-browser.mjs > qa-evidence/v3-locale-browser.log 2>&1
      - name: Server rendered HTML checks
        id: ssr
        continue-on-error: true
        run: |
          node scripts/with-app-env.mjs node_modules/vite/bin/vite.js dev --host 127.0.0.1 --port 8095 > qa-evidence/ssr-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -sf 'http://127.0.0.1:8095/?lang=tr' > /dev/null && break; sleep 1; done
          node scripts/v3-ssr-smoke.mjs > qa-evidence/v3-ssr.log 2>&1
      - name: Production server build
        id: production
        continue-on-error: true
        run: npm run build > qa-evidence/production.log 2>&1
      - name: Evidence summary
        if: always()
        run: |
          printf '%s\n' 'scenes=${{ steps.scenes.outcome }}' 'dependencies=${{ steps.dependencies.outcome }}' 'locale=${{ steps.locale.outcome }}' 'tests=${{ steps.tests.outcome }}' 'types=${{ steps.types.outcome }}' 'lint=${{ steps.lint.outcome }}' 'catalogue=${{ steps.catalogue.outcome }}' 'pages=${{ steps.pages.outcome }}' 'browser=${{ steps.browser.outcome }}' 'editorial=${{ steps.editorial.outcome }}' 'v3=${{ steps.v3.outcome }}' 'ssr=${{ steps.ssr.outcome }}' 'production=${{ steps.production.outcome }}' | tee qa-evidence/status.txt
          git rev-parse HEAD > qa-evidence/commit.txt
          git ls-files -z | xargs -0 sha256sum > qa-evidence/source-sha256.txt
          for f in qa-evidence/*.log; do echo "===== $f ====="; tail -25 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detoks-v31-quality-evidence
          path: qa-evidence
          retention-days: 14
      - name: Require all quality gates
        if: always()
        run: |
          test '${{ steps.scenes.outcome }}' = success
          test '${{ steps.dependencies.outcome }}' = success
          test '${{ steps.locale.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.types.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.catalogue.outcome }}' = success
          test '${{ steps.pages.outcome }}' = success
          test '${{ steps.browser.outcome }}' = success
          test '${{ steps.editorial.outcome }}' = success
          test '${{ steps.v3.outcome }}' = success
          test '${{ steps.ssr.outcome }}' = success
          test '${{ steps.production.outcome }}' = success
